[package]
name = "embassy-blinky"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-println = { version = "0.12.0", features = ["esp32c3"] }
esp-hal = { version = "0.21.1", features = ["esp32c3"] }
esp-backtrace = { version = "0.14.2", features = [
    "esp32c3",
    "panic-handler",
    "println",
] }

embassy-executor = { version = "0.6.3", features = [] }
embassy-time = { version = "0.3.2" }
esp-hal-embassy = { version = "0.4.0", features = [
    "esp32c3",
    "executors",
    "integrated-timers",
] }
# embedded-hal = "1.0.0"

fixes = { path = "../../tools/fixes" }
