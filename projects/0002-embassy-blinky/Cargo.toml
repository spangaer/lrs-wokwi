[package]
name = "embassy-blinky"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-println = { workspace = true, features = ["esp32c3"] }
esp-hal = { workspace = true, features = ["esp32c3"] }
esp-backtrace = { workspace = true, features = [
    "esp32c3",
    "panic-handler",
    "println",
] }

esp-hal-embassy = { workspace = true, features = ["esp32c3", "executors"] }
embassy-executor = { workspace = true, features = [] }
embassy-time = { workspace = true, features = ["generic-queue"] }

fixes = { path = "../../tools/fixes" }
