[package]
name = "name-printer"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-println = { workspace = true, features = ["esp32c3"] }
esp-hal = { workspace = true, features = ["esp32c3"] }
esp-backtrace = { workspace = true, features = [
    "esp32c3",
    "panic-handler",
    "println",
] }

mipidsi = "0.8.0"
display-interface-spi = "0.5.0"
display-interface = "0.5.0"
embedded-graphics = "0.8.0"
embedded-hal = "1.0.0"
embedded-hal-bus = "0.2.0"
profont = "0.7.0"

names = { path = "../../tools/names" }
fixes = { path = "../../tools/fixes" }
