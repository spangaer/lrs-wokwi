[package]
name = "embassy-blinky-sync-pwm"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-println = { version = "0.12.0", features = ["esp32c3"] }
esp-hal = { version = "0.22.0", features = ["esp32c3"] }
esp-backtrace = { version = "0.14.2", features = [
    "esp32c3",
    "panic-handler",
    "println",
] }

embassy-executor = { version = "0.6.3", features = [] }
embassy-time = { version = "0.3.2", features = ["generic-queue"] }
esp-hal-embassy = { version = "0.5.0", features = ["esp32c3", "executors"] }
fugit = { version = "*" }
# embedded-hal = "1.0.0"

#https://github.com/matklad/once_cell/blob/4fbd4a53509ca59c8e09efc2ab0a22f21de70f7e/Cargo.toml#L57
once_cell = { version = "1.20", default-features = false, features = [
    "critical-section",
] }
# static_cell = "2.1"

fixes = { path = "../../tools/fixes" }
